
<div class="signin-container">
  <form class="signin-card" (ngSubmit)="onSignIn()" #signInForm="ngForm">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="form-group">
      <label for="identifier">Email or Username</label>
      <input id="identifier" type="text" name="identifier" [(ngModel)]="identifier" placeholder="Enter your email or username" autocomplete="username" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password" required />
        <button type="button" class="toggle-password" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</button>
      </div>
    </div>

    @if (errorMessage()) {
      <div class="message error" role="alert">{{ errorMessage() }}</div>
    }

    @if (successMessage()) {
      <div class="message success" role="status">{{ successMessage() }}</div>
    }

    <button class="signin-button" type="submit" [disabled]="loading() || !signInForm.valid">
      {{ loading() ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</div>
