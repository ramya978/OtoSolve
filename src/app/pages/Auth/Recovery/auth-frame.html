<!-- Shared frame of the account-recovery screens (MFA, forgot / reset password, confirm it is you):
     the same card as the sign-in screen - the page title on the left, the OtoSolve logo on the right. -->
<main class="lg-shell">
  <section class="lg-card">
    <section class="lg-form-side lg-frame">
      <!-- the logo sits on the title line, at the right (see auth-frame.css) -->
      <header class="lg-brand-row">
        <span class="lg-mark" aria-hidden="true">O</span>
        <span class="lg-brand-name">OtoSolve</span>
      </header>
      <ng-content />
    </section>
  </section>
</main>
