<!-- =====================================================================================================
     LEAD CAPTURE - shell (lead-capture.ts · lead-capture.css)
     Heading · Single lead / Bulk upload switch (child routes /single and /bulk) · <router-outlet>.
     ===================================================================================================== -->
<header class="lc-head">
  <div class="lc-title">
    <span class="lc-eyebrow">Donors &amp; Leads</span>
    <h1>Lead capture</h1>
    <p>Add one person by hand, or bring many in from a spreadsheet.</p>
  </div>

  <nav class="lc-modes" aria-label="Capture mode">
    @for (m of modes; track m.path) {
      <a class="lc-mode" [routerLink]="m.path" routerLinkActive="is-on" #rla="routerLinkActive"
         [attr.aria-current]="rla.isActive ? 'page' : null">
        <span class="lc-mode-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icon(m.icon)" /></svg></span>
        <span class="lc-mode-txt"><b>{{ m.label }}</b><small>{{ m.hint }}</small></span>
      </a>
    }
  </nav>
</header>

<router-outlet />
