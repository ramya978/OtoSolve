# =================================================================================================
# BROWSER SECURITY HEADERS (NEW-06). Copied to /etc/nginx/snippets/security-headers.conf.
#
# INCLUDED IN THE SERVER BLOCK AND IN EVERY LOCATION THAT SETS ITS OWN add_header. nginx does not
# merge add_header across levels: a location with even one add_header of its own drops every one
# it would have inherited. Each such location in nginx.conf therefore includes this file again.
#
# WHAT EACH ONE STOPS
#   X-Frame-Options / frame-ancestors  another site framing the sign-in, approval or payment pages
#                                      and tricking a click (clickjacking).
#   X-Content-Type-Options             a downloaded file being run as a script because the browser
#                                      guessed its type.
#   Referrer-Policy                    full page addresses (with record ids in the query string)
#                                      leaking to other sites in the Referer header.
#   Permissions-Policy                 pages using the camera or microphone they never need.
#                                      Location stays allowed: geo-fenced attendance uses it.
#   Strict-Transport-Security          a later visit downgrading to plain HTTP. Browsers ignore it
#                                      on a plain-HTTP response, so it only takes effect behind TLS.
#
# THE CONTENT SECURITY POLICY COMES IN TWO PARTS.
#   Enforced: frame-ancestors, base-uri and object-src. None of them can break a working page.
#   Report-only: the full policy, so every resource it would block shows as a console warning
#   without blocking anything. Once a full pass of the application (sign-in, MFA, every module,
#   a Razorpay test payment, attachment previews) shows no warnings, move it to the enforced header.
# =================================================================================================
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.razorpay.com; frame-src 'self' blob: https://*.razorpay.com; form-action 'self' https://*.razorpay.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
